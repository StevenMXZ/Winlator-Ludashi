import java.net.URL
import java.security.MessageDigest

buildscript {
    repositories {
        google()
        mavenCentral()
        gradlePluginPortal()
    }
    dependencies {
        // Adjust Gradle plugin versions if needed
        classpath 'com.android.tools.build:gradle:8.8.0'
    }

}

plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
    id 'org.jetbrains.kotlin.plugin.compose'
}

tasks.register("downloadImageFS") {
    def assetDir = new File(project.rootDir, ["app","src","main","assets"].join(File.separator))
    File imageFS = new File(assetDir, "imagefs.tar.zst")
    int parts = 2

    doLast {
        if (!imageFS.exists()) {
            println("ImageFS was not present, downloading...\n")
            FileOutputStream outputStream = new FileOutputStream(imageFS)
            for (int i = 0; i < parts; i++) {
                File partFile = new File(assetDir, String.format("imagefs.tar.zst.%02d", i))
                String partURL = String.format("https://raw.githubusercontent.com/Other-backup/winlator-imagefs-v2/main/imagefs.tar.zst.%02d", i)
                new URL(partURL).withInputStream { p ->
                    partFile.withOutputStream { it << p }
                    outputStream << partFile.bytes
                }
                partFile.delete()
            }
            outputStream.close()
        }
    }
}

tasks.register("downloadProton") {
    def assetDir = new File(project.rootDir, ["app","src","main","assets"].join(File.separator))
    File protonARM64EC = new File(assetDir, "proton-11.0-7-arm64ec.tar.zst")
    File staleProtonARM64EC = new File(assetDir, "proton-9.0-arm64ec.tar.zst")
    // The .wcp release is a Zstandard tar archive. Keep the bundled name aligned with wine_entries.
    String protonURL = "https://github.com/Other-backup/winlator-imagefs-v2/releases/download/pnew2/proton-wine-11.0-7-arm64ec.wcp"
    String protonSHA256 = "1ef0bb9efceb2278933b3fa2bfd374999b0d9a7c74045b67b9af8a9b5260f734"
    long protonSize = 112607135L

    def fileSHA256 = { File file ->
        MessageDigest digest = MessageDigest.getInstance("SHA-256")
        file.withInputStream { input ->
            byte[] buffer = new byte[64 * 1024]
            int read
            while ((read = input.read(buffer)) != -1) digest.update(buffer, 0, read)
        }
        digest.digest().collect { String.format("%02x", ((int) it) & 0xff) }.join()
    }

    doLast {
        if (staleProtonARM64EC.exists()) staleProtonARM64EC.delete()
        File staleProton10 = new File(assetDir, "proton-10.0-5-arm64ec.tar.zst")
        if (staleProton10.exists()) staleProton10.delete()

        boolean valid = protonARM64EC.isFile()
                && protonARM64EC.length() == protonSize
                && fileSHA256(protonARM64EC).equalsIgnoreCase(protonSHA256)
        if (!valid) {
            if (protonARM64EC.exists()) protonARM64EC.delete()
            println("Proton 11 ARM64EC was not present or failed validation, downloading...\n")
            String protonApiURL = "https://api.github.com/repos/Other-backup/winlator-imagefs-v2/releases/assets/695820250"
            File partial = new File(assetDir, protonARM64EC.name + ".part")
            Exception lastFailure = null
            for (int attempt = 1; attempt <= 4 && !valid; attempt++) {
                for (String candidate : [protonApiURL, protonURL]) {
                    try {
                        partial.delete()
                        def connection = new URL(candidate).openConnection()
                        connection.setConnectTimeout(30000)
                        connection.setReadTimeout(120000)
                        connection.setRequestProperty("Accept", "application/octet-stream")
                        connection.setRequestProperty("User-Agent", "Winlator-Ludashi-build")
                        if (candidate == protonApiURL && System.getenv("GITHUB_TOKEN")) {
                            connection.setRequestProperty("Authorization", "Bearer " + System.getenv("GITHUB_TOKEN"))
                        }
                        connection.getInputStream().withCloseable { input ->
                            partial.withOutputStream { output -> output << input }
                        }
                        if (!partial.isFile() || partial.length() != protonSize || !fileSHA256(partial).equalsIgnoreCase(protonSHA256)) {
                            throw new GradleException("Proton 11 ARM64EC size/SHA-256 verification failed")
                        }
                        java.nio.file.Files.move(partial.toPath(), protonARM64EC.toPath(), java.nio.file.StandardCopyOption.REPLACE_EXISTING)
                        valid = true
                        break
                    } catch (Exception error) {
                        lastFailure = error
                        println("Proton 11 download attempt ${attempt} failed; trying another endpoint.")
                    } finally {
                        partial.delete()
                    }
                }
                if (!valid && attempt < 4) Thread.sleep(4000L * attempt)
            }
            if (!valid) throw new GradleException("Could not download the verified Proton 11 ARM64EC archive after retries", lastFailure)
        }
    }
}

tasks.register("prepareKotlinBuildScriptModel"){}
tasks.register("downloadComponentTools") {
    def nativeTools = layout.buildDirectory.dir("generated/component-tools/arm64-v8a")
    def manifestFile = rootProject.file("app/src/main/scripts/component-tools.json")
    outputs.dir(nativeTools)
    inputs.file(manifestFile)
    doLast {
        def manifest = new groovy.json.JsonSlurper().parse(manifestFile)
        File directory = nativeTools.get().asFile
        directory.mkdirs()
        manifest.each { name, expected ->
            File target = new File(directory, name)
            def hash = { File f ->
                def digest = MessageDigest.getInstance("SHA-256")
                f.withInputStream { input ->
                    byte[] buffer = new byte[65536]
                    int count
                    while ((count = input.read(buffer)) != -1) digest.update(buffer, 0, count)
                }
                digest.digest().encodeHex().toString()
            }
            if (!target.isFile() || hash(target) != expected) {
                File part = new File(directory, name + ".part")
                try {
                    new URL("https://raw.githubusercontent.com/Other-backup/winlator-imagefs-v2/ludashi-components/component-tools/arm64-v8a/" + name).withInputStream { input ->
                        part.withOutputStream { output -> output << input }
                    }
                    if (hash(part) != expected) throw new GradleException("Component tool checksum mismatch: " + name)
                    java.nio.file.Files.move(part.toPath(), target.toPath(), java.nio.file.StandardCopyOption.REPLACE_EXISTING)
                } finally { part.delete() }
            }
        }
    }
}
downloadProton.dependsOn(downloadImageFS)
preBuild.dependsOn(downloadProton)
preBuild.dependsOn(downloadComponentTools)

android {
    sourceSets.main.jniLibs.srcDir(layout.buildDirectory.dir("generated/component-tools"))
    namespace 'com.winlator.cmod'
    // Keep compileSdk from your current config. If you want to match Termux-X11, you could set to 34.
    compileSdk 35
    buildToolsVersion "35.0.0"

    lint {
        disable 'ExpiredTargetSdkVersion'
    }

    defaultConfig {
        applicationId "com.winlator.cmod"
        minSdkVersion 28
        // We’re preserving Winlator’s request to keep targetSdkVersion at 28
        targetSdkVersion 28

        versionCode 54
        versionName "5.0"

        // External native build from Winlator
        externalNativeBuild {
            cmake {
                cppFlags ''
            }
        }

        // You originally only did arm64-v8a. If you want multi-ABI splits, see below.
        ndk {
            abiFilters 'arm64-v8a'
        }
    }

    // Java versions: Winlator uses Java 17, Termux-X11 used 1.9
    // Using 17 is typically fine (covers 1.9 features).
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    kotlinOptions {
        jvmTarget = '17'
        freeCompilerArgs += ['-opt-in=androidx.compose.material3.ExperimentalMaterial3Api']
    }

    signingConfigs {
        upstream {
            storeFile file(System.getenv("LUDASHI_KEYSTORE_PATH") ?: "missing-upstream-signing.p12")
            storeType "PKCS12"
            storePassword System.getenv("LUDASHI_STORE_PASSWORD") ?: ""
            keyAlias "upstream"
            keyPassword System.getenv("LUDASHI_STORE_PASSWORD") ?: ""
        }
    }

    // Keep Winlator’s buildTypes
    buildTypes {
        debug {
            minifyEnabled false
        }
        release {
            minifyEnabled false
            signingConfig signingConfigs.upstream
            crunchPngs false
        }
    }

    ndkVersion '29.0.14206865'

    externalNativeBuild {
        cmake {
            path 'src/main/cpp/CMakeLists.txt'
        }
    }

    // If you want to be sure modern JNI packaging is used:
    packagingOptions {
        jniLibs {
            useLegacyPackaging = true
            pickFirsts += ['**/libc++_shared.so']
        }
        resources {
            pickFirsts += ["assets/dexopt/baseline.prof", "assets/dexopt/baseline.profm"]
        }
    }

    testOptions { unitTests.includeAndroidResources = true }

    buildFeatures {
        prefab = true
        compose = true
    }
}

