// Robolectric runs on the host JVM; its TLS provider needs host, rather than Android, JNI.
configurations.configureEach {
    if (name.endsWith('UnitTestRuntimeClasspath')) {
        exclude group: 'org.conscrypt', module: 'conscrypt-android'
    }
}

// Robolectric fetches its Android SDK image at test runtime outside Gradle's Maven resolver.
// Use the Maven Central canonical host instead of the default repo1.maven.org endpoint.
tasks.withType(Test).configureEach {
    systemProperty 'robolectric.dependency.repo.url', 'https://repo.maven.apache.org/maven2'
    testLogging {
        events 'failed'
        exceptionFormat 'full'
    }
}
