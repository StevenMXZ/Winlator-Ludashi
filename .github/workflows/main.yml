name: Compile CMOD

on:
  push:
    branches: [ "build" ]
  pull_request:
    branches: [ "build" ]

jobs:
  build:

    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - name: Prepare Submodules
      run: |
       git submodule update --init --recursive ||

       # Adrenotools
       if [ ! -f "app/src/main/cpp/adrenotools/CMakeLists.txt" ]; then
       echo "Fallback for adrenotools submodule..."
       rm -rf app/src/main/cpp/adrenotools
       git clone --recursive https://github.com/Pipetto-crypto/libadrenotools.git app/src/main/cpp/adrenotools
       fi
       
       # Linkernsbypass
       if [ ! -f "app/src/main/cpp/adrenotools/lib/linkernsbypass/CMakeLists.txt" ]; then
       echo "Fallback for linkernsbypass submodule..."
       rm -rf app/src/main/cpp/adrenotools/lib/linkernsbypass
       git clone https://github.com/Pipetto-crypto/liblinkernsbypass.git app/src/main/cpp/adrenotools/lib/linkernsbypass
       fi

    - name: set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'
        cache: gradle

    - name: Install dependencies
      run: |
       sudo apt-get update
       sudo apt-get install -y libgl1 libglu1-mesa libc6 lib32z1

    - name: Grant execute permission for gradlew
      run: chmod +x gradlew

    - name: Build with Gradle
      run: ./gradlew assembleDebug

    - name: Get Short SHA
      run: echo "SHORT_SHA=$(git rev-parse --short HEAD)" >> $GITHUB_ENV

    - name: List files
      run: |
       ls -la app/src/main/assets

    - name: Create Release
      uses: softprops/action-gh-release@v2
      with:
        name: "Winlator Bionic ${{ env.SHORT_SHA }}"
        tag_name: ${{ env.SHORT_SHA }}
        prerelease: true
        files: ./app/build/outputs/apk/debug/app-debug.apk






