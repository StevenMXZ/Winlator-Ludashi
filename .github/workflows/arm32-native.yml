name: ARM32 native compile probe

on:
  push:
    branches:
      - arm32-port-prototype
  pull_request:
    branches:
      - arm32-port-prototype
  workflow_dispatch:

permissions:
  contents: read

jobs:
  arm32-native:
    name: Compile native targets for armeabi-v7a
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source and submodules
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Rust and ARMv7 Android target
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: armv7-linux-androideabi

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android platform, build tools, NDK and CMake
        run: |
          sdkmanager "platforms;android-35" "build-tools;35.0.0" \
            "ndk;29.0.14206865" "cmake;3.22.1"

      - name: Compile ARM32 native libraries only
        run: |
          chmod +x ./gradlew
          ./gradlew :app:externalNativeBuildDebug \
            -PwinlatorAbi=armeabi-v7a \
            -PwinlatorNativeCompileOnly=true \
            --stacktrace
