name: Ludashi 5.0 organized

on:
  workflow_dispatch:
  push:
    branches:
      - ludashi-4.2-organized

permissions:
  contents: write

concurrency:
  group: ludashi-steam-port-${{ github.ref }}
  cancel-in-progress: false

jobs:
  native-tests:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Install WFG validation tools
        run: |
          sudo apt-get update
          sudo apt-get install -y glslang-tools spirv-tools libvulkan-dev
      - name: Validate WFG and disabled frame generation
        run: |
          python3 app/src/main/cpp/winlator/renderer/vulkan/wfg/tests/test_backend.py
          python3 app/src/main/cpp/winlator/renderer/vulkan/wfg/tests/test_direct_output.py
          python3 app/src/main/cpp/winlator/renderer/vulkan/wfg/tests/test_source_snapshot.py
          python3 app/src/main/cpp/winlator/renderer/vulkan/lsfg/tests/test_disabled_path.py
          python3 app/src/main/cpp/winlator/renderer/vulkan/lsfg/tests/test_live_enable.py
      - name: Validate the native X11 core with sanitizers
        env:
          ASAN_OPTIONS: detect_leaks=1:halt_on_error=1
          UBSAN_OPTIONS: halt_on_error=1:print_stacktrace=1
        run: |
          cmake -S app/src/main/cpp/ludashix11 -B "$RUNNER_TEMP/native-x11-host" \
            -DCMAKE_BUILD_TYPE=Debug \
            -DCMAKE_CXX_FLAGS='-fsanitize=address,undefined -fno-omit-frame-pointer'
          cmake --build "$RUNNER_TEMP/native-x11-host" -j2
          "$RUNNER_TEMP/native-x11-host/ludashix11_renderer_test"
          python3 app/src/main/cpp/ludashix11/tests/test_command_cache.py
          python3 app/src/main/cpp/ludashix11/tests/test_gpu_timing.py
          python3 app/src/main/cpp/ludashix11/tests/test_validation_config.py
          python3 app/src/main/cpp/ludashix11/tests/test_image_fences.py
          python3 app/src/main/cpp/ludashix11/tests/test_drawable.py
          python3 app/src/main/cpp/winlator/tests/test_displayx_present_queue.py
          python3 app/src/main/cpp/winlator/tests/test_displayx_network.py
          g++ -std=c++17 app/src/main/cpp/winlator/tests/test_displayx_protocol.cpp -o "$RUNNER_TEMP/displayx-protocol"
          "$RUNNER_TEMP/displayx-protocol"
          "$RUNNER_TEMP/native-x11-host/ludashix11_host" --displayx-timeline
          python3 app/src/main/cpp/winlator/tests/test_displayx_work_duration.py
          python3 app/src/main/cpp/ludashix11/tests/test_displayx_renderer.py
          python3 app/src/main/cpp/ludashix11/tests/test_displayx_bridge.py "$RUNNER_TEMP/native-x11-host/ludashix11_host"
          python3 app/src/main/cpp/winlator/tests/verify_critical_jni.py
          python3 app/src/main/cpp/winlator/tests/test_native_streams.py
          python3 app/src/main/cpp/ludashix11/tests/test_composition.py
          "$RUNNER_TEMP/native-x11-host/ludashix11_host" --pending-cow
          python3 app/src/main/cpp/ludashix11/tests/test_async_import.py "$RUNNER_TEMP/native-x11-host/ludashix11_host"
          python3 app/src/main/cpp/ludashix11/tests/test_hidden_cursor.py "$RUNNER_TEMP/native-x11-host/ludashix11_host"
          python3 app/src/main/cpp/ludashix11/tests/test_wire.py "$RUNNER_TEMP/native-x11-host/ludashix11_host"
          python3 app/src/main/cpp/ludashix11/tests/test_compat.py "$RUNNER_TEMP/native-x11-host/ludashix11_host"
          python3 app/src/main/cpp/ludashix11/tests/test_xinput.py "$RUNNER_TEMP/native-x11-host/ludashix11_host"
          python3 app/src/main/cpp/ludashix11/tests/test_fps_limit.py "$RUNNER_TEMP/native-x11-host/ludashix11_host"
          python3 app/src/main/cpp/ludashix11/tests/test_shm.py "$RUNNER_TEMP/native-x11-host/ludashix11_host"
          python3 app/src/main/cpp/ludashix11/tests/test_randr.py "$RUNNER_TEMP/native-x11-host/ludashix11_host"
          python3 app/src/main/cpp/ludashix11/tests/test_retirement.py "$RUNNER_TEMP/native-x11-host/ludashix11_host"
          python3 app/src/main/cpp/ludashix11/tests/test_frame_release.py "$RUNNER_TEMP/native-x11-host/ludashix11_host"
          python3 app/src/main/cpp/ludashix11/tests/test_present_scene.py "$RUNNER_TEMP/native-x11-host/ludashix11_host"
          python3 app/src/main/cpp/ludashix11/tests/test_scene_wakeup.py "$RUNNER_TEMP/native-x11-host/ludashix11_host"
          python3 app/src/main/cpp/ludashix11/tests/test_drawable_scene.py "$RUNNER_TEMP/native-x11-host/ludashix11_host"
          python3 app/src/main/cpp/ludashix11/tests/test_sync_sleep.py "$RUNNER_TEMP/native-x11-host/ludashix11_host"
          python3 app/src/main/cpp/ludashix11/tests/test_extensions.py "$RUNNER_TEMP/native-x11-host/ludashix11_host"
          python3 app/src/main/cpp/ludashix11/tests/test_hidden_present.py "$RUNNER_TEMP/native-x11-host/ludashix11_host"
          python3 app/src/main/cpp/ludashix11/tests/test_present_configure.py "$RUNNER_TEMP/native-x11-host/ludashix11_host"
          python3 app/src/main/cpp/ludashix11/tests/test_late_latch.py "$RUNNER_TEMP/native-x11-host/ludashix11_host"
      - name: Test controller waits with sanitizers
        env:
          ASAN_OPTIONS: detect_leaks=1:halt_on_error=1
          UBSAN_OPTIONS: halt_on_error=1:print_stacktrace=1
        run: python3 app/src/main/cpp/winlator/tests/test_fakeinput_wait.py
      - name: Test live controls and magnifier
        run: |
          python3 app/src/main/scripts/test_live_exclusive_focus.py
          python3 app/src/main/scripts/test_magnifier_pan.py

  android-apk:
    needs: native-tests
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - name: Checkout the test branch
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Install Android native build tools
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y cmake ninja-build glslang-tools zstd g++-mingw-w64-x86-64-posix

      - name: Bundle Khronos Vulkan validation layer
        run: |
          set -euo pipefail
          VVL_VERSION="1.4.357.0"
          VVL_SHA256="daaeac9291167a2d5257a8a0f7c0a86e56d0821d0211af661710fe68c8040ffa"
          VVL_ARCHIVE="$RUNNER_TEMP/android-binaries-$VVL_VERSION.tar.gz"
          VVL_DIR="$RUNNER_TEMP/vulkan-validation-layers"
          curl --retry 3 -fL "https://github.com/KhronosGroup/Vulkan-ValidationLayers/releases/download/vulkan-sdk-$VVL_VERSION/android-binaries-$VVL_VERSION.tar.gz" -o "$VVL_ARCHIVE"
          echo "$VVL_SHA256  $VVL_ARCHIVE" | sha256sum -c -
          mkdir -p "$VVL_DIR"
          tar -xzf "$VVL_ARCHIVE" -C "$VVL_DIR"
          LAYER="$(find "$VVL_DIR" -type f -path '*/arm64-v8a/libVkLayer_khronos_validation.so' -print -quit)"
          test -n "$LAYER"
          mkdir -p app/src/main/jniLibs/arm64-v8a
          cp "$LAYER" app/src/main/jniLibs/arm64-v8a/libVkLayer_khronos_validation.so

      - name: Install Rust Android target
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android

      - name: Build Ludashi Steam launcher
        run: bash app/src/main/cpp/ludashi-steam-launcher/build.sh

      - name: Test native Steam client
        run: cargo test --locked --manifest-path app/src/main/cpp/ludashi-steam-client/rust/Cargo.toml

      - name: Download verified Gradle distribution with fallback
        run: bash .github/scripts/prepare-gradle.sh

      - name: Run Android tests
        run: >-
          bash gradlew testDebugUnitTest --no-daemon --max-workers=2
          -Dorg.gradle.jvmargs="-Xmx3072m -XX:MaxMetaspaceSize=1024m -Dfile.encoding=UTF-8"
          -Pkotlin.compiler.execution.strategy=in-process
          --no-configuration-cache --stacktrace

      - name: Restore the existing release signing identity
        env:
          GH_TOKEN: ${{ github.token }}
          LUDASHI_KEYSTORE_B64: ${{ secrets.LUDASHI_KEYSTORE_B64 }}
          LUDASHI_STORE_PASSWORD: ${{ secrets.LUDASHI_STORE_PASSWORD }}
        run: |
          set -euo pipefail
          if [ -z "${LUDASHI_KEYSTORE_B64:-}" ]; then
            gh release view upstream-signing --repo "$GITHUB_REPOSITORY" >/dev/null
          fi
          bash app/src/main/scripts/prepare-upstream-signing.sh

      - name: Build signed release APK
        run: >-
          bash gradlew assembleRelease --no-daemon --max-workers=2
          -Dorg.gradle.jvmargs="-Xmx3072m -XX:MaxMetaspaceSize=1024m -Dfile.encoding=UTF-8"
          -Pkotlin.compiler.execution.strategy=in-process
          --no-configuration-cache --stacktrace

      - name: Report runner resources on failure
        if: failure()
        run: |
          free -h
          df -h
          for path in /sys/fs/cgroup/memory.events /sys/fs/cgroup/memory.peak /sys/fs/cgroup/memory.max; do
            if [ -r "$path" ]; then
              echo "$path"
              cat "$path"
            fi
          done

      - name: Verify native Steam library is packaged
        run: |
          python3 -c 'import zipfile; z = zipfile.ZipFile("app/build/outputs/apk/release/app-release.apk"); assert not any(n.lower().endswith((".p12", ".pfx", ".jks", ".keystore")) or n.rsplit("/", 1)[-1].lower() == "password.txt" for n in z.namelist()), "Signing files must not be packaged"; assert "lib/arm64-v8a/libludashisteam.so" in z.namelist(); assert b"libludashisteam.so" not in z.read("lib/arm64-v8a/libwinlator.so"), "Steam must not be a dependency of the emulator core"'

      - name: Verify update compatibility with Ludashi 4.2
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          reference="$RUNNER_TEMP/update-reference"
          mkdir -p "$reference"
          gh release download ludashi-4.2-organized-49-r2 --repo "$GITHUB_REPOSITORY" --pattern app-release.apk --dir "$reference"
          signer="$ANDROID_HOME/build-tools/35.0.0/apksigner"
          "$signer" verify --print-certs "$reference/app-release.apk" > "$reference/old-cert.txt"
          "$signer" verify --print-certs app/build/outputs/apk/release/app-release.apk > "$reference/new-cert.txt"
          python3 - "$reference" <<'PYVERIFY'
          import pathlib, re, sys
          root = pathlib.Path(sys.argv[1])
          def digest(name):
              return re.search(r'Signer #1 certificate SHA-256 digest: (\S+)', (root / name).read_text()).group(1)
          assert digest('old-cert.txt') == digest('new-cert.txt'), 'Release signing identity differs from Ludashi 4.2'
          PYVERIFY
          "$ANDROID_HOME/build-tools/35.0.0/aapt" dump badging app/build/outputs/apk/release/app-release.apk | awk 'NR == 1' > "$reference/package.txt"
          "$ANDROID_HOME/build-tools/35.0.0/aapt" dump badging "$reference/app-release.apk" | awk 'NR == 1' > "$reference/old-package.txt"
          python3 - "$reference" <<'PYUPDATE'
          import pathlib, re, sys
          root = pathlib.Path(sys.argv[1])
          def package(name):
              text = (root / name).read_text()
              return re.search(r"name='([^']+)'", text).group(1), int(re.search(r"versionCode='(\d+)'", text).group(1))
          old, new = package('old-package.txt'), package('package.txt')
          assert old[0] == new[0] == 'com.winlator.cmod', 'Application ID changed'
          assert new[1] > old[1], 'Release versionCode must increase'
          print(f'Update compatibility verified: versionCode {old[1]} -> {new[1]}, same release certificate')
          PYUPDATE

      - name: Publish release APK
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          tag="ludashi-5.0-organized-${{ github.run_number }}-r${{ github.run_attempt }}"
          echo 'Ludashi 5.0 organized with Steam support, signed for updates over the existing Ludashi 4.2 release.' > "$RUNNER_TEMP/release-notes.txt"
          gh release create "$tag" \
            app/build/outputs/apk/release/app-release.apk#Winlator-Ludashi-5.0.apk \
            --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" \
            --title "Ludashi 5.0 organized #${{ github.run_number }}" \
            --notes-file "$RUNNER_TEMP/release-notes.txt" --prerelease
