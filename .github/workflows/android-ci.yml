name: Android CI Bionic - Mesa 26.0.4 Upgrade

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Clone repository
      uses: actions/checkout@v4
      with:
        submodules: recursive

    - name: Set up JDK 23
      uses: actions/setup-java@v4
      with:
        java-version: '23'
        distribution: 'temurin'
        cache: gradle

    - name: Install Latest Meson and Build Dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y python3-pip ninja-build gettext
        # Force upgrade to the absolute latest stable Meson for Mesa 26 support
        pip3 install --upgrade meson mako
        meson --version

    - name: Create Android Cross-File
      run: |
        mkdir -p .github/workflows
        cat <<EOF > .github/workflows/android-arm64.txt
        [binaries]
        c = 'aarch64-linux-android33-clang'
        cpp = 'aarch64-linux-android33-clang++'
        ar = 'aarch64-linux-android-ar'
        strip = 'aarch64-linux-android-strip'
        pkgconfig = 'pkg-config'

        [host_machine]
        system = 'android'
        cpu_family = 'aarch64'
        cpu = 'armv8-a'
        endian = 'little'

        [properties]
        android_sdk_cache_dir = '/home/runner/android_sdk_cache'
        EOF

    - name: Fetch and Compile Mesa 26.0.4
      run: |
        wget https://archive.mesa3d.org/mesa-26.0.4.tar.xz
        tar -xvf mesa-26.0.4.tar.xz
        cd mesa-26.0.4
        
          --cross-file ../.github/workflows/android-arm64.txt \
          -Dplatforms=android \
          -Dplatform-sdk-version=33 \
          -Dgallium-drivers=panfrost,zink,freedreno \
          -Dvulkan-drivers=panfrost,freedreno,swrast \
          -Dbuildtype=release \
          -Doptimization=3 \
          -Dgles1=disabled \
          -Dgles2=enabled \
          -Dopengl=true \
          -Degl=enabled

        ninja -C build-android

        # Move compiled binaries to app assets
        mkdir -p ../app/src/main/assets/graphics_driver/mesa
        cp build-android/src/gallium/targets/dri/libgallium_dri.so ../app/src/main/assets/graphics_driver/mesa/
        cp build-android/src/panfrost/vulkan/libvulkan_panfrost.so ../app/src/main/assets/graphics_driver/mesa/
        cp build-android/src/freedreno/vulkan/libvulkan_freedreno.so ../app/src/main/assets/graphics_driver/mesa/

    - name: Update Version Registry
      run: |
        JSON_FILE="app/src/main/assets/graphics_driver/graphics_drivers.json"
        if [ -f "$JSON_FILE" ]; then
          sed -i 's/"version": "[0-9.]*"/"version": "26.0.4"/g' $JSON_FILE
        fi

    - name: Grant execute permission for gradlew
      run: chmod +x gradlew

    - name: Build with Gradle
      run: ./gradlew assembleDebug

    - name: Attach release in action
      uses: actions/upload-artifact@v4
      with:
       name: Winlator-Ludashi-Mesa26-Public
       path: ./app/build/outputs/apk/debug/app-debug.apk
