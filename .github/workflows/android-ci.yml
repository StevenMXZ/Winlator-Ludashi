name: Android CI Bionic

on:
  workflow_dispatch:

jobs:
  build-mesa:
    runs-on: ubuntu-latest
    steps:
    - name: Download Mesa 26.0.4
      run: |
        wget https://archive.mesa3d.org/mesa-26.0.4.tar.xz
        tar -xf mesa-26.0.4.tar.xz
        mv mesa-26.0.4 mesa-src

    - name: Install and Map Dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y \
          libclc-18-dev libelf-dev \
          pkg-config gettext flex bison ninja-build cmake \
          llvm-18-dev libclang-18-dev zlib1g-dev libexpat1-dev glslang-tools
        
        # Create the 'installed' directory as requested
        mkdir -p installed/pkgconfig
        
        # Copy the libclc bitcode files into our local 'installed' dir
        cp -r /usr/share/clc ./installed/
        
        # Create the registration file inside our new 'installed' directory
        cat <<EOF > installed/pkgconfig/libclc.pc
        prefix=${{ github.workspace }}/installed
        includedir=/usr/include
        libexecdir=\${prefix}/clc
        Name: libclc
        Description: Library requirements for OpenCL C
        Version: 18.1.0
        Cflags: -I\${includedir}
        EOF
        
        python -m venv venv
        source venv/bin/activate
        pip install "meson>=1.4.0" "mako>=1.2.0" "packaging==23.2"

    - name: Setup Android NDK
      uses: nttld/setup-ndk@v1
      id: setup_ndk
      with:
        ndk-version: r27b

    - name: Create Cross File with 'installed' Paths
      run: |
        NDK_PATH="${{ steps.setup_ndk.outputs.ndk-path }}"
        TOOLCHAIN="$NDK_PATH/toolchains/llvm/prebuilt/linux-x86_64"
        
        cat <<EOF > android-aarch64.txt
        [binaries]
        c = '$TOOLCHAIN/bin/aarch64-linux-android35-clang'
        cpp = '$TOOLCHAIN/bin/aarch64-linux-android35-clang++'
        ar = '$TOOLCHAIN/bin/llvm-ar'
        strip = '$TOOLCHAIN/bin/llvm-strip'
        pkg-config = '/usr/bin/pkg-config'
        glslangValidator = '/usr/bin/glslangValidator'
        llvm-config = '/usr/bin/llvm-config-18'

        [host_machine]
        system = 'android'
        cpu_family = 'aarch64'
        cpu = 'armv8-a'
        endian = 'little'

        [built-in options]
        c_args = ['-O3', '-march=armv8-a', '-mtune=cortex-a75', '-fomit-frame-pointer', '-fPIC']
        cpp_args = ['-O3', '-march=armv8-a', '-mtune=cortex-a75', '-fomit-frame-pointer', '-fPIC']
        c_link_args = ['-fuse-ld=lld']
        cpp_link_args = ['-fuse-ld=lld']

        [properties]
        needs_exe_wrapper = true
        # We point directly to our custom 'installed' directory
        libclc_path = '${{ github.workspace }}/installed/clc'
        pkg_config_libdir = ['${{ github.workspace }}/installed/pkgconfig', '/usr/share/pkgconfig', '/usr/lib/aarch64-linux-gnu/pkgconfig', '$TOOLCHAIN/sysroot/usr/lib/aarch64-linux-android/pkgconfig']
        EOF

    - name: Compile Mesa (Vortex-emu Core)
      run: |
        source venv/bin/activate
        cd mesa-src
        
        # We add the PKG_CONFIG_PATH export to make sure it looks in 'installed' first
        export PKG_CONFIG_PATH="${{ github.workspace }}/installed/pkgconfig:$PKG_CONFIG_PATH"
        
        meson setup build-android \
          --cross-file ../android-aarch64.txt \
          -Dplatforms=android \
          -Dplatform-sdk-version=35 \
          -Dgallium-drivers=panfrost,zink,freedreno \
          -Dvulkan-drivers=panfrost,freedreno \
          -Dbuildtype=release \
          -Dllvm=enabled \
          -Dandroid-stub=true \
          -Dopengl=true \
          -Dgles1=enabled \
          -Dgles2=enabled \
          -Dglvnd=disabled
          
        meson compile -C build-android

    - name: Upload Drivers
      uses: actions/upload-artifact@v4
      with:
        name: Mesa-26-Universal-Build
        path: |
          mesa-src/build-android/src/gallium/targets/dri/*.so
          mesa-src/build-android/src/vulkan/device-select/*.so
          mesa-src/build-android/src/panfrost/vulkan/*.so
          mesa-src/build-android/src/freedreno/vulkan/*.so
