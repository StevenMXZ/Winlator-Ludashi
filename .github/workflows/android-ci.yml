name: Android CI Bionic

on:
  workflow_dispatch:

jobs:
  build-mesa:
    runs-on: ubuntu-latest
    steps:
    - name: Download Mesa 26.0.4 Stable
      run: |
        wget https://archive.mesa3d.org/mesa-26.0.4.tar.xz
        tar -xf mesa-26.0.4.tar.xz
        mv mesa-26.0.4 mesa-src

    - name: Set up Python 3.11
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'

    - name: Install Build Tools
      run: |
        sudo apt-get update
        sudo apt-get install -y pkg-config gettext flex bison libwayland-dev \
                             libx11-dev ninja-build libglvnd-dev glslang-tools
        python -m venv venv
        source venv/bin/activate
        pip install --upgrade pip
        pip install "meson>=1.4.0" "mako>=1.2.0" "packaging==23.2" "setuptools<70.0"

    - name: Setup Android NDK
      uses: nttld/setup-ndk@v1
      id: setup_ndk
      with:
        ndk-version: r27b

    - name: Create Meson Cross File
      run: |
        TOOLCHAIN="${{ steps.setup_ndk.outputs.ndk-path }}/toolchains/llvm/prebuilt/linux-x86_64"
        cat <<EOF > android-aarch64.txt
        [binaries]
        c = '$TOOLCHAIN/bin/aarch64-linux-android35-clang'
        cpp = '$TOOLCHAIN/bin/aarch64-linux-android35-clang++'
        ar = '$TOOLCHAIN/bin/llvm-ar'
        strip = '$TOOLCHAIN/bin/llvm-strip'
        pkgconfig = 'pkg-config'

        [host_machine]
        system = 'android'
        cpu_family = 'aarch64'
        cpu = 'armv8-a'
        endian = 'little'

        [properties]
        needs_exe_wrapper = true
        EOF

    - name: Compile Mesa 26.0.4
      run: |
        source venv/bin/activate
        cd mesa-src
        meson setup build-android \
          --cross-file ../android-aarch64.txt \
          -Dplatforms=android \
          -Dplatform-sdk-version=35 \
          -Dgallium-drivers=panfrost,zink,freedreno \
          -Dvulkan-drivers=panfrost,freedreno \
          -Dbuildtype=release \
          -Dandroid-stub=true \
          -Dopengl=true \
          -Dgles1=enabled \
          -Dgles2=enabled
        meson compile -C build-android

    - name: Upload Driver Artifacts
      uses: actions/upload-artifact@v4
      with:
        name: Mesa-26-Vulkan-Drivers
        path: |
          mesa-src/build-android/src/gallium/targets/dri/*.so
          mesa-src/build-android/src/vulkan/device-select/*.so

  build-vortex:
    needs: build-mesa
    runs-on: ubuntu-latest
    steps:
    - name: Clone Vortex Repository
      uses: actions/checkout@v4
      with:
        repository: Disco-sys/Vortex-emu
        ref: winlator_bionic
        submodules: recursive

    - name: Set up JDK 23
      uses: actions/setup-java@v4
      with:
        java-version: '23'
        distribution: 'temurin'

    - name: Inject Vulkan Driver Logic
      run: |
        mkdir -p app/src/main/assets/graphics_driver/vulkan
        sed -i '/<string-array name="graphics_driver_entries">/a \        <item>Vulkan</item>' app/src/main/res/values/arrays.xml
        sed -i '/<string-array name="graphics_driver_values">/a \        <item>vulkan_hub</item>' app/src/main/res/values/arrays.xml

        LOGIC_FILE="app/src/main/java/com/winlator/cmod/ContainerDetailFragment.java"
        if [ -f "$LOGIC_FILE" ]; then
          sed -i 's/case "wrapper":/case "vulkan_hub":\n            case "wrapper":/g' "$LOGIC_FILE"
          sed -i '/case "vulkan_hub":/a \                driverPath = "graphics_driver/vulkan";\n                envVars.put("MESA_LOADER_DRIVER_OVERRIDE", "zink");\n                envVars.put("GALLIUM_DRIVER", "zink");' "$LOGIC_FILE"
        fi

        JSON_FILE="app/src/main/assets/graphics_drivers.json"
        if [ -f "$JSON_FILE" ]; then
          sed -i '0,/\[/{s/\[/\[\n    {"name": "Vulkan", "version": "Mesa 26.0.4-Vortex", "path": "graphics_driver/vulkan" },/}' "$JSON_FILE"
        fi

    - name: Build Vortex APK
      run: |
        chmod +x gradlew
        ./gradlew assembleDebug
        mv app/build/outputs/apk/debug/*.apk Vortex.apk

    - name: Upload Final APK
      uses: actions/upload-artifact@v4
      with:
        name: Vortex-Vulkan-Build
        path: Vortex.apk
