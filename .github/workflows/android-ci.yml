name: Android CI Bionic

on:
  workflow_dispatch:

jobs:
  build-mesa:
    runs-on: ubuntu-latest
    steps:
    - name: Download Mesa 26.0.4 Stable
      run: |
        wget https://archive.mesa3d.org/mesa-26.0.4.tar.xz
        tar -xf mesa-26.0.4.tar.xz
        mv mesa-26.0.4 mesa-src

    - name: Set up Python and Meson
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'

    - name: Install Build Dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y meson ninja-build pkg-config python3-mako \
                             gettext flex bison libwayland-dev libx11-dev

    - name: Setup Android NDK
      uses: nttld/setup-ndk@v1
      with:
        ndk-version: r27b

    - name: Create Meson Cross File
      run: |
        cat <<EOF > android-aarch64.txt
        [binaries]
        c = '$ANDROID_NDK_ROOT/toolchains/llvm/prebuilt/linux-x86_64/bin/aarch64-linux-android35-clang'
        cpp = '$ANDROID_NDK_ROOT/toolchains/llvm/prebuilt/linux-x86_64/bin/aarch64-linux-android35-clang++'
        ar = '$ANDROID_NDK_ROOT/toolchains/llvm/prebuilt/linux-x86_64/bin/llvm-ar'
        strip = '$ANDROID_NDK_ROOT/toolchains/llvm/prebuilt/linux-x86_64/bin/llvm-strip'
        pkgconfig = 'pkg-config'
        [host_machine]
        system = 'android'
        cpu_family = 'aarch64'
        cpu = 'armv8-a'
        endian = 'little'
        [properties]
        needs_exe_wrapper = true
        EOF

    - name: Compile Mesa 26.0.4
      run: |
        cd mesa-src
        meson setup build-android \
          --cross-file ../android-aarch64.txt \
          -Dplatforms=android \
          -Dplatform-sdk-version=35 \
          -Dgallium-drivers=panfrost,zink,freedreno \
          -Dvulkan-drivers=panfrost,freedreno \
          -Dbuildtype=release \
          -Dandroid-stub=true
        meson compile -C build-android

    - name: Upload Driver Binaries
      uses: actions/upload-artifact@v4
      with:
        name: Mesa-26-Vulkan-Drivers
        path: |
          mesa-src/build-android/src/gallium/targets/dri/*.so
          mesa-src/build-android/src/vulkan/device-select/*.so

  build-vortex:
    needs: build-mesa
    runs-on: ubuntu-latest
    steps:
    - name: Clone Vortex Repository
      uses: actions/checkout@v4
      with:
        repository: Disco-sys/Vortex-emu
        ref: winlator_bionic
        submodules: recursive

    - name: Set up JDK 23
      uses: actions/setup-java@v4
      with:
        java-version: '23'
        distribution: 'temurin'
        cache: gradle

    - name: Patch Vulkan Driver Path
      run: |
        # Inject "Vulkan" into UI Arrays
        sed -i '/<string-array name="graphics_driver_entries">/a \        <item>Vulkan</item>' app/src/main/res/values/arrays.xml
        sed -i '/<string-array name="graphics_driver_values">/a \        <item>vulkan_hub</item>' app/src/main/res/values/arrays.xml

        # Add logic to point to assets/graphics_driver/vulkan
        LOGIC_FILE="app/src/main/java/com/winlator/cmod/ContainerDetailFragment.java"
        if [ -f "$LOGIC_FILE" ]; then
          sed -i 's/case "wrapper":/case "vulkan_hub":\n            case "wrapper":/g' "$LOGIC_FILE"
          sed -i '/case "vulkan_hub":/a \                driverPath = "vulkan_hub";\n                envVars.put("MESA_LOADER_DRIVER_OVERRIDE", "zink");\n                envVars.put("GALLIUM_DRIVER", "zink");' "$LOGIC_FILE"
        fi

        # Update Graphics JSON to match assets structure
        JSON_FILE="app/src/main/assets/graphics_drivers.json"
        if [ -f "$JSON_FILE" ]; then
          sed -i '0,/\[/{s/\[/\[\n    {"name": "Vulkan", "version": "vulkan_hub", "path": "graphics_driver/vulkan" },/}' "$JSON_FILE"
        fi

    - name: Build Vortex APK
      run: |
        chmod +x gradlew
        ./gradlew assembleDebug
        mv app/build/outputs/apk/debug/*.apk Vortex.apk

    - name: Upload Finished APK
      uses: actions/upload-artifact@v4
      with:
       name: Vortex-Official-Vulkan-Build
       path: Vortex.apk
