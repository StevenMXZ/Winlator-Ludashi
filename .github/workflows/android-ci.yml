name: Build Vortex APK with Microphone Feature (Auto-Patch)

on:
  workflow_dispatch:
  push:
    branches: [ winlator_bionic ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: winlator_bionic

      # ------------------------------------------------------------
      # 1. Add microphone item to the sidebar menu
      # ------------------------------------------------------------
      - name: Patch xserver_menu.xml to add microphone item
        run: |
          MENU_FILE="app/src/main/res/menu/xserver_menu.xml"
          # Check if already added (avoid duplicates)
          if ! grep -q "main_menu_microphone" "$MENU_FILE"; then
            # Insert before the closing </group>
            sed -i '/<\/group>/i\
        <item\
            android:id="@+id/main_menu_microphone"\
            android:icon="@drawable/ic_mic"\
            android:title="Microphone" />' "$MENU_FILE"
          fi

      # ------------------------------------------------------------
      # 2. Create native microphone capture C++ file
      # ------------------------------------------------------------
      - name: Create MicrophoneCapture.cpp
        run: |
          mkdir -p app/src/main/cpp
          cat > app/src/main/cpp/MicrophoneCapture.cpp << 'EOF'
          #include <jni.h>
          #include <android/log.h>
          #include <SLES/OpenSLES.h>
          #include <SLES/OpenSLES_Android.h>
          #include <pthread.h>
          #include <unistd.h>
          #include <cstring>
          #include <cstdio>

          #define LOG_TAG "MicrophoneCapture"
          #define LOGI(...) __android_log_print(ANDROID_LOG_INFO, LOG_TAG, __VA_ARGS__)

          static volatile int isCapturing = 0;
          static pthread_t captureThread;

          static void* captureLoop(void* arg) {
              const char* pipePath = "/data/data/com.winlator.vortex/cache/mic_pipe";
              FILE* pipe = fopen(pipePath, "wb");
              if (!pipe) {
                  LOGI("Failed to open pipe");
                  return nullptr;
              }
              const int bufferSize = 48000 * 2; // 1 second, stereo 16-bit
              short* buffer = new short[bufferSize];
              while (isCapturing) {
                  memset(buffer, 0, bufferSize * sizeof(short));
                  // In a real implementation you would capture from OpenSL ES
                  // For now, write silence (replace with actual capture later)
                  fwrite(buffer, sizeof(short), bufferSize, pipe);
                  usleep(10000);
              }
              delete[] buffer;
              fclose(pipe);
              return nullptr;
          }

          extern "C" {
          JNIEXPORT void JNICALL
          Java_com_winlator_container_ContainerActivity_nativeEnableMicrophone(JNIEnv* env, jobject thiz, jboolean enable) {
              if (enable && !isCapturing) {
                  isCapturing = 1;
                  pthread_create(&captureThread, nullptr, captureLoop, nullptr);
                  LOGI("Microphone capture started");
              } else if (!enable && isCapturing) {
                  isCapturing = 0;
                  pthread_join(captureThread, nullptr);
                  LOGI("Microphone capture stopped");
              }
          }
          }
          EOF

      # ------------------------------------------------------------
      # 3. Update CMakeLists.txt to include the new library
      # ------------------------------------------------------------
      - name: Update CMakeLists.txt
        run: |
          CMAKE_FILE="app/src/main/cpp/CMakeLists.txt"
          if ! grep -q "microphone" "$CMAKE_FILE"; then
            # Add library definition before the final target_link_libraries line
            sed -i '/add_library(.*SHARED.*)/a\
            add_library(microphone SHARED MicrophoneCapture.cpp)\
            target_link_libraries(microphone log OpenSLES)' "$CMAKE_FILE"
          fi

      # ------------------------------------------------------------
      # 4. Patch ContainerActivity.java to add native method and toggle logic
      # ------------------------------------------------------------
      - name: Patch ContainerActivity.java
        run: |
          ACTIVITY_FILE="app/src/main/java/com/winlator/container/ContainerActivity.java"
          # Add static block and native method after class declaration
          if ! grep -q "nativeEnableMicrophone" "$ACTIVITY_FILE"; then
            sed -i '/public class ContainerActivity extends AppCompatActivity {/a\
        private boolean isMicEnabled = false;\
        private native void nativeEnableMicrophone(boolean enable);\
        static {\
            System.loadLibrary("microphone");\
        }' "$ACTIVITY_FILE"
          fi
          # Add menu item handling inside onOptionsItemSelected
          # Find the line with 'switch (item.getItemId())' or similar and insert case
          if ! grep -q "main_menu_microphone" "$ACTIVITY_FILE"; then
            sed -i '/case R.id.main_menu_exit:/i\
                case R.id.main_menu_microphone:\
                    isMicEnabled = !isMicEnabled;\
                    nativeEnableMicrophone(isMicEnabled);\
                    if (isMicEnabled) {\
                        item.setTitle("Microphone ON");\
                        item.getIcon().setTint(android.graphics.Color.BLUE);\
                    } else {\
                        item.setTitle("Microphone");\
                        item.getIcon().setTint(android.graphics.Color.WHITE);\
                    }\
                    return true;' "$ACTIVITY_FILE"
          fi

      # ------------------------------------------------------------
      # 5. Patch container startup script to create pipe and PulseAudio source
      # ------------------------------------------------------------
      - name: Patch startup script (add mic pipe and pulse module)
        run: |
          START_SCRIPT="assets/scripts/start.sh"
          # Assuming the script uses pulseaudio; add lines after pulseaudio start
          if ! grep -q "mic_pipe" "$START_SCRIPT"; then
            sed -i '/pulseaudio --start/a\
            # Create FIFO for microphone capture\
            PIPE_PATH="/data/data/com.winlator.vortex/cache/mic_pipe"\
            mkfifo $PIPE_PATH 2>/dev/null || true\
            # Load pipe source into PulseAudio\
            pactl load-module module-pipe-source source_name=vortex_mic file=$PIPE_PATH format=s16le rate=48000 channels=2\
            # Set as default source (optional)\
            pactl set-default-source vortex_mic' "$START_SCRIPT"
          fi

      # ------------------------------------------------------------
      # 6. Build the APK (no Mesa compile, just Android app)
      # ------------------------------------------------------------
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Build debug APK
        run: ./gradlew assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Vortex-Mic-Feature-APK
          path: app/build/outputs/apk/debug/*.apk
