name: Android CI Bionic

on:
  workflow_dispatch:

jobs:
  build-mesa:
    runs-on: ubuntu-latest
    steps:
    - name: Download Mesa 26.0.4
      run: |
        wget https://archive.mesa3d.org/mesa-26.0.4.tar.xz
        tar -xf mesa-26.0.4.tar.xz
        mv mesa-26.0.4 mesa-src

    - name: Prepare 'installed' Directory
      run: |
        sudo apt-get update
        sudo apt-get install -y libclc-18 libclc-18-dev libelf-dev pkg-config llvm-18-dev glslang-tools
        
        # Create our local vault
        mkdir -p ${{ github.workspace }}/installed/pkgconfig
        mkdir -p ${{ github.workspace }}/installed/clc
        
        # Find and copy bitcode files to our vault
        find /usr/share/clc /usr/lib/clc -name "*.bc" -exec cp {} ${{ github.workspace }}/installed/clc/ \; || true
        
        # Create the manual registration for Meson
        cat <<EOF > ${{ github.workspace }}/installed/pkgconfig/libclc.pc
        prefix=${{ github.workspace }}/installed
        includedir=/usr/include
        libexecdir=\${prefix}/clc
        Name: libclc
        Description: Hand-mapped libclc for Vortex
        Version: 18.1.0
        Cflags: -I\${includedir}
        EOF

    - name: Setup Android NDK
      uses: nttld/setup-ndk@v1
      id: setup_ndk
      with:
        ndk-version: r27b

    - name: Create Cross File
      run: |
        NDK_PATH="${{ steps.setup_ndk.outputs.ndk-path }}"
        TOOLCHAIN="$NDK_PATH/toolchains/llvm/prebuilt/linux-x86_64"
        
        cat <<EOF > android-aarch64.txt
        [binaries]
        c = '$TOOLCHAIN/bin/aarch64-linux-android35-clang'
        cpp = '$TOOLCHAIN/bin/aarch64-linux-android35-clang++'
        ar = '$TOOLCHAIN/bin/llvm-ar'
        strip = '$TOOLCHAIN/bin/llvm-strip'
        pkg-config = '/usr/bin/pkg-config'
        llvm-config = '/usr/bin/llvm-config-18'

        [host_machine]
        system = 'android'
        cpu_family = 'aarch64'
        cpu = 'armv8-a'
        endian = 'little'

        [properties]
        needs_exe_wrapper = true
        libclc_path = '${{ github.workspace }}/installed/clc'
        pkg_config_libdir = ['${{ github.workspace }}/installed/pkgconfig']
        EOF

    - name: Compile Mesa (Vortex-emu Core)
      run: |
        # 1. Prepare Python with PyYAML (the final hurdle)
        python -m venv venv
        source venv/bin/activate
        pip install "meson>=1.4.0" "mako>=1.2.0" "packaging==23.2" PyYAML
        
        cd mesa-src
        
        # 2. Tell Meson to use our vault
        export PKG_CONFIG_PATH="${{ github.workspace }}/installed/pkgconfig"
        export PKG_CONFIG_LIBDIR="${{ github.workspace }}/installed/pkgconfig"
        
        # 3. Setup the build
        meson setup build-android \
          --cross-file ../android-aarch64.txt \
          -Dplatforms=android \
          -Dplatform-sdk-version=35 \
          -Dgallium-drivers=panfrost,zink,freedreno \
          -Dvulkan-drivers=panfrost,freedreno \
          -Dbuildtype=release \
          -Dllvm=enabled \
          -Dandroid-stub=true \
          -Dopengl=true \
          -Dgles1=enabled \
          -Dgles2=enabled \
          -Dglvnd=disabled
          
        # 4. Execute the actual compilation
        meson compile -C build-android

    - name: Upload Drivers
      uses: actions/upload-artifact@v4
      with:
        name: Mesa-26-Universal-Build
        path: |
          mesa-src/build-android/src/gallium/targets/dri/*.so
          mesa-src/build-android/src/vulkan/device-select/*.so
          mesa-src/build-android/src/panfrost/vulkan/*.so
          mesa-src/build-android/src/freedreno/vulkan/*.so
