name: Android CI Bionic

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Clone repository
      uses: actions/checkout@v4
      with:
        submodules: recursive

    - name: Set up JDK 23
      uses: actions/setup-java@v4
      with:
        java-version: '23'
        distribution: 'temurin'
        cache: gradle

    - name: Patch Files (Wherever they are)
      run: |
        # 1. Register Vortek in the JSON
        JSON_FILE=$(find . -name "graphics_drivers.json")
        if [ -n "$JSON_FILE" ]; then
          sed -i '0,/\[/{s/\[/\[\n    {"name": "Vortek Wrapper", "version": "vortek", "path": "vortek" },/}' "$JSON_FILE"
        fi

        # 2. Add the 2.1 vs 2.0 logic to the Detail/Editor file
        # This searches for the file that handles container settings
        DETAIL_FILE=$(find . -name "ContainersDetailFragment.java" -o -name "ContainerConfigFragment.java")
        if [ -n "$DETAIL_FILE" ]; then
          sed -i '/case "vortek":/a \                driverPath = version.equals("2.1") ? "vortek/vortek-2.1.tzst" : "vortek/vortek-2.0.tzst";' "$DETAIL_FILE"
        fi

        # 3. Create asset dir and download files
        ASSETS_DIR=$(find . -type d -name "assets" | head -n 1)
        if [ -n "$ASSETS_DIR" ]; then
          mkdir -p "$ASSETS_DIR/graphics_driver/vortek"
          wget -O "$ASSETS_DIR/graphics_driver/vortek/vortek-2.0.tzst" https://github.com/Disco-sys/Winlator-Ludashi/raw/winlator_bionic/app/src/main/assets/graphics_driver/vortek-2.0.tzst
          wget -O "$ASSETS_DIR/graphics_driver/vortek/vortek-2.1.tzst" https://github.com/Disco-sys/Winlator-Ludashi/raw/winlator_bionic/app/src/main/assets/graphics_driver/vortek-2.1.tzst
        fi

    - name: Grant execute permission for gradlew
      run: find . -name gradlew -exec chmod +x {} +

    - name: Build with Gradle
      run: ./gradlew assembleDebug

    - name: Attach release
      uses: actions/upload-artifact@v4
      with:
       name: Winlator-Ludashi-M-Mod
       path: "**/build/outputs/apk/debug/*.apk"
