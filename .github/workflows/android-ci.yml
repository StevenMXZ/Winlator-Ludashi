name: Android CI Bionic

on:
  workflow_dispatch:

jobs:
  build-mesa:
    runs-on: ubuntu-latest
    steps:
    - name: Download Mesa 26.0.4
      run: |
        wget https://archive.mesa3d.org/mesa-26.0.4.tar.xz
        tar -xf mesa-26.0.4.tar.xz
        mv mesa-26.0.4 mesa-src

    - name: Massive Dependency Injection
      run: |
        sudo apt-get update
        # Installing EVERYTHING to satisfy all possible Meson checks
        sudo apt-get install -y \
          pkg-config gettext flex bison ninja-build cmake \
          libclc-18-dev libelf-dev libwayland-dev libx11-dev \
          libxext-dev libxdamage-dev libxfixes-dev libxcb-glx0-dev \
          libxcb-shm0-dev libxcb-dri2-0-dev libxcb-dri3-dev \
          libxcb-present-dev libxshmfence-dev libxxf86vm-dev \
          libxrandr-dev libxrender-dev libxnvctrl-dev \
          libglvnd-dev glslang-tools llvm-18-dev libclang-18-dev \
          libva-dev libvdpau-dev libomxil-bellagio-dev \
          python3-mako python3-pil python3-requests python3-setuptools \
          zlib1g-dev libexpat1-dev
        
        python -m venv venv
        source venv/bin/activate
        pip install "meson>=1.4.0" "mako>=1.2.0" "packaging==23.2"

    - name: Setup Android NDK
      uses: nttld/setup-ndk@v1
      id: setup_ndk
      with:
        ndk-version: r27b

    - name: Create Heavy-Duty Cross File
      run: |
        NDK_PATH="${{ steps.setup_ndk.outputs.ndk-path }}"
        TOOLCHAIN="$NDK_PATH/toolchains/llvm/prebuilt/linux-x86_64"
        
        cat <<EOF > android-aarch64.txt
        [binaries]
        c = '$TOOLCHAIN/bin/aarch64-linux-android35-clang'
        cpp = '$TOOLCHAIN/bin/aarch64-linux-android35-clang++'
        ar = '$TOOLCHAIN/bin/llvm-ar'
        strip = '$TOOLCHAIN/bin/llvm-strip'
        pkg-config = '/usr/bin/pkg-config'
        cmake = '/usr/bin/cmake'
        glslangValidator = '/usr/bin/glslangValidator'
        llvm-config = '/usr/bin/llvm-config-18'

        [host_machine]
        system = 'android'
        cpu_family = 'aarch64'
        cpu = 'armv8-a'
        endian = 'little'

        [built-in options]
        c_args = ['-O3', '-march=armv8-a', '-mtune=cortex-a75', '-fomit-frame-pointer', '-fPIC']
        cpp_args = ['-O3', '-march=armv8-a', '-mtune=cortex-a75', '-fomit-frame-pointer', '-fPIC']
        c_link_args = ['-fuse-ld=lld']
        cpp_link_args = ['-fuse-ld=lld']

        [properties]
        needs_exe_wrapper = true
        # Allow Meson to see the vast library of dependencies we just installed
        pkg_config_libdir = ['/usr/share/pkgconfig', '/usr/lib/aarch64-linux-gnu/pkgconfig', '$TOOLCHAIN/sysroot/usr/lib/aarch64-linux-android/pkgconfig']
        EOF

    - name: Compile Mesa 26.0.4 (Maximum Coverage)
      run: |
        source venv/bin/activate
        export PKG_CONFIG_PATH=/usr/share/pkgconfig
        export PKG_CONFIG_ALLOW_SYSTEM_LIBS=1
        
        cd mesa-src
        # Added -Dgallium-vdpau=disabled and others to prevent it from trying to build 
        # desktop-only video acceleration which would fail on Android headers.
        meson setup build-android \
          --cross-file ../android-aarch64.txt \
          -Dplatforms=android \
          -Dplatform-sdk-version=35 \
          -Dgallium-drivers=panfrost,zink,freedreno \
          -Dvulkan-drivers=panfrost,freedreno \
          -Dbuildtype=release \
          -Dllvm=disabled \
          -Dandroid-stub=true \
          -Dopengl=true \
          -Dgles1=enabled \
          -Dgles2=enabled \
          -Dglvnd=disabled \
          -Dgallium-vdpau=disabled \
          -Dgallium-va=disabled \
          -Dgallium-xa=disabled \
          -Dshared-glapi=enabled
          
        meson compile -C build-android

    - name: Upload Drivers
      uses: actions/upload-artifact@v4
      with:
        name: Mesa-26-Full-Dependency-Build
        path: |
          mesa-src/build-android/src/gallium/targets/dri/*.so
          mesa-src/build-android/src/vulkan/device-select/*.so
          mesa-src/build-android/src/panfrost/vulkan/*.so
          mesa-src/build-android/src/freedreno/vulkan/*.so
