name: Android CI Bionic

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Clone repository
      uses: actions/checkout@v4
      with:
        submodules: recursive

    - name: Set up JDK 23
      uses: actions/setup-java@v4
      with:
        java-version: '23'
        distribution: 'temurin'
        cache: gradle

    - name: Patch Branding and Vortek Logic
      run: |
        # 1. SET INTERNAL APP NAME
        STRINGS_PATH="app/src/main/res/values/strings.xml"
        if [ -f "$STRINGS_PATH" ]; then
          sed -i 's/<string name="app_name">.*<\/string>/<string name="app_name">Vortex Emu<\/string>/g' "$STRINGS_PATH"
        fi

        # 2. APPLY LOGO (1776048162593.png)
        find app/src/main/res -name "ic_launcher.png" -exec cp "1776048162593.png" {} \;
        find app/src/main/res -name "ic_launcher_round.png" -exec cp "1776048162593.png" {} \;

        # 3. VORTEK DRIVER UI LOGIC
        DETAIL_JAVA="app/src/main/java/com/winlator/cmod/ContainersDetailFragment.java"
        if [ -f "$DETAIL_JAVA" ]; then
          sed -i '/case "vortek":/a \                driverPath = version.equals("2.1") ? "vortek/vortek-2.1.tzst" : "vortek/vortek-2.0.tzst";' "$DETAIL_JAVA"
        fi

        # 4. REGISTER VORTEK IN ASSETS
        JSON_FILE="app/src/main/assets/graphics_driver/graphics_drivers.json"
        if [ -f "$JSON_FILE" ]; then
          sed -i '0,/\[/{s/\[/\[\n    {"name": "Vortek Wrapper", "version": "vortek", "path": "vortek" },/}' "$JSON_FILE"
        fi

    - name: Grant execute permission for gradlew
      run: chmod +x gradlew

    - name: Build and Rename APK
      run: |
        ./gradlew assembleDebug
        mv app/build/outputs/apk/debug/*.apk app/build/outputs/apk/debug/Vortex.apk

    - name: Upload Vortex Artifact
      uses: actions/upload-artifact@v4
      with:
       name: Vortex-Build
       path: app/build/outputs/apk/debug/Vortex.apk
