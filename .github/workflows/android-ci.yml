name: Android CI Bionic (Optimized Layer Stack)

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Clone repository
      uses: actions/checkout@v4
      with:
        submodules: recursive

    - name: Set up JDK 23
      uses: actions/setup-java@v4
      with:
        java-version: '23'
        distribution: 'temurin'
        cache: gradle

        - name: Standard Driver Configuration
      run: |
        echo "Resetting to standard public build configuration..."
        # No hardcoded overrides - let the app use its default detection logic
        # Ensure the directories exist for the standard build process
        mkdir -p app/src/main/assets/graphics_driver/mesa

    - name: Grant execute permission for gradlew
      run: chmod +x gradlew

    - name: Build with Gradle
      run: ./gradlew assembleDebug

    - name: Attach release in action
      uses: actions/upload-artifact@v4
      with:
       name: Winlator-Ludashi-Optimized-G85
       path: ./app/build/outputs/apk/debug/app-debug.apk

    - name: "Get Short SHA"
      run: echo "SHORT_SHA=$(git rev-parse --short HEAD)" >> $GITHUB_ENV
