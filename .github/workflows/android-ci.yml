name: Android CI Bionic - Mesa 26.0.4 Upgrade

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Clone repository
      uses: actions/checkout@v4
      with:
        submodules: recursive

    - name: Set up JDK 23
      uses: actions/setup-java@v4
      with:
        java-version: '23'
        distribution: 'temurin'
        cache: gradle

    - name: Install Build Dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y python3-pip ninja-build gettext
        pip3 install meson mako

    - name: Fetch and Compile Mesa 26.0.4
      run: |
        # 1. Download source
        wget https://archive.mesa3d.org/mesa-26.0.4.tar.xz
        tar -xvf mesa-26.0.4.tar.xz
        cd mesa-26.0.4

        # 2. Configure for Android Bionic (Universal Public Build)
        # Enabling panfrost (Mali), turnip (Adreno), and zink (Generic)
        meson setup build-android \
          --cross-file ../.github/workflows/android-arm64.txt \
          -Dplatforms=android \
          -Dplatform-sdk-version=33 \
          -Dgallium-drivers=panfrost,zink,virgl \
          -Dvulkan-drivers=panfrost,turnip \
          -Dbuildtype=release \
          -Doptimization=3 \
          -Degl=enabled \
          -Dgles1=disabled \
          -Dgles2=enabled \
          -Dopengl=true

        # 3. Compile
        ninja -C build-android

        # 4. Move binaries to app assets for inclusion in APK
        mkdir -p ../app/src/main/assets/graphics_driver/mesa
        cp build-android/src/gallium/targets/dri/libgallium_dri.so ../app/src/main/assets/graphics_driver/mesa/
        cp build-android/src/panfrost/vulkan/libvulkan_panfrost.so ../app/src/main/assets/graphics_driver/mesa/
        cp build-android/src/freedreno/vulkan/libvulkan_freedreno.so ../app/src/main/assets/graphics_driver/mesa/

    - name: Update Version Registry
      run: |
        JSON_FILE="app/src/main/assets/graphics_driver/graphics_drivers.json"
        # Ensure the UI reflects the new version
        sed -i 's/"version": "[0-9.]*"/"version": "26.0.4"/g' $JSON_FILE

    - name: Grant execute permission for gradlew
      run: chmod +x gradlew

    - name: Build with Gradle
      run: ./gradlew assembleDebug

    - name: Attach release in action
      uses: actions/upload-artifact@v4
      with:
       name: Winlator-Mmod-Mesa26
       path: ./app/build/outputs/apk/debug/app-debug.apk
