name: Android CI Bionic

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Clone repository
      uses: actions/checkout@v4
      with:
        submodules: recursive

    - name: set up JDK 23
      uses: actions/setup-java@v4
      with:
        java-version: '23'
        distribution: 'temurin'
        cache: gradle

    - name: Install Mesa Build Dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y meson ninja-build python3-mako

    - name: Set up NDK
      uses: nttld/setup-ndk@v1
      with:
        ndk-version: r27c

    - name: Build Mesa
      run: |
        meson setup build-mesa \
          --cross-file .github/workflows/arm64-android.txt \
          -Dplatforms=android \
          -Dgallium-drivers=panfrost,zink \
          -Dvulkan-drivers=panfrost \
          -Dbuildtype=release \
          .
        ninja -C build-mesa install

    - name: Grant execute permission for gradlew
      run: chmod +x gradlew
      
    - name: Build with Gradle
      run: ./gradlew assembleDebug

    - name: Attach release in action
      uses: actions/upload-artifact@v4
      with:
       name: Winlator Bionic apk
       path: ./app/build/outputs/apk/debug/app-debug.apk

    - name: Get Version
      run: echo "VERSION=$(cat app/build.gradle.kts | grep versionName | cut -d "=" -f 2 | sed 's/"//g' | xargs)" >> $GITHUB_ENV
