name: Signed upstream release
on:
  workflow_dispatch:
  push:
    branches: [feature/4.1-upstream]
    paths:
      - app/build.gradle
      - .github/workflows/upstream-release.yml
permissions:
  contents: write
concurrency:
  group: upstream-signed-release
  cancel-in-progress: false
jobs:
  release:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref }}
          fetch-depth: 1
      - uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: temurin
          cache: gradle
      - name: Restore the persistent upstream signing identity
        env:
          GH_TOKEN: ${{ github.token }}
          LUDASHI_KEYSTORE_B64: ${{ secrets.LUDASHI_KEYSTORE_B64 }}
          LUDASHI_STORE_PASSWORD: ${{ secrets.LUDASHI_STORE_PASSWORD }}
        run: bash app/src/main/scripts/prepare-upstream-signing.sh
      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y glslang-tools ninja-build zstd
          rm -rf app/src/main/cpp/adrenotools
          git clone https://github.com/Pipetto-crypto/libadrenotools.git app/src/main/cpp/adrenotools
          git -C app/src/main/cpp/adrenotools checkout 8483dfdaa2abf97ee89ad0e5f337e7b508550c6b
          git clone https://github.com/Pipetto-crypto/liblinkernsbypass.git app/src/main/cpp/adrenotools/lib/linkernsbypass
      - name: Bundle Khronos Vulkan validation layer
        run: |
          set -euo pipefail
          VVL_VERSION="1.4.357.0"
          VVL_SHA256="daaeac9291167a2d5257a8a0f7c0a86e56d0821d0211af661710fe68c8040ffa"
          VVL_ARCHIVE="$RUNNER_TEMP/android-binaries-$VVL_VERSION.tar.gz"
          VVL_DIR="$RUNNER_TEMP/vulkan-validation-layers"
          curl --retry 3 -fL \
            "https://github.com/KhronosGroup/Vulkan-ValidationLayers/releases/download/vulkan-sdk-$VVL_VERSION/android-binaries-$VVL_VERSION.tar.gz" \
            -o "$VVL_ARCHIVE"
          echo "$VVL_SHA256  $VVL_ARCHIVE" | sha256sum -c -
          mkdir -p "$VVL_DIR"
          tar -xzf "$VVL_ARCHIVE" -C "$VVL_DIR"
          LAYER="$(find "$VVL_DIR" -type f -path '*/arm64-v8a/libVkLayer_khronos_validation.so' -print -quit)"
          test -n "$LAYER"
          mkdir -p app/src/main/jniLibs/arm64-v8a
          cp "$LAYER" app/src/main/jniLibs/arm64-v8a/libVkLayer_khronos_validation.so
          test -s app/src/main/jniLibs/arm64-v8a/libVkLayer_khronos_validation.so

      - name: Test and build the signed APK
        run: |
          chmod +x gradlew
          python3 app/src/main/scripts/test_apk_delta.py
          python3 app/src/main/scripts/test_live_exclusive_focus.py
          ./gradlew testDebugUnitTest assembleRelease
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose --print-certs app/build/outputs/apk/release/app-release.apk
      - name: Preserve the signed baseline APK in the source repository
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          code=$(sed -nE 's/^[[:space:]]*versionCode ([0-9]+).*/\1/p' app/build.gradle)
          tag="upstream-build-$code"
          if ! gh release view "$tag" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release create "$tag" --repo "$GITHUB_REPOSITORY" --draft --target "$GITHUB_SHA" --title "Signed upstream build $code" --notes 'Signed APK for the new upstream update line.'
          fi
          gh release upload "$tag" app/build/outputs/apk/release/app-release.apk --repo "$GITHUB_REPOSITORY" --clobber
      # Public distribution is deferred. Keep this build in the private draft release.

